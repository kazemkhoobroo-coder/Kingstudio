<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>King Studio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07070b;--surface:#101018;--surface-2:#16161f;--border:#24242f;
  --text:#f5f5fa;--muted:#8a8aa0;--gold:#c9a84c;--gold-glow:rgba(201,168,76,.25);
  --top-h:72px;--bottom-h:96px;
}

/* ===== تنظیمات ضد لگ ===== */
html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:pan-y}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased;user-select:none}
.hidden { display: none !important; }

/* ===== انیمیشن‌ها (GPU Accelerated) ===== */
@keyframes rotateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes pulseNeon { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.95); } }
@keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }

/* ===== TOP PANEL ===== */
.top-panel{position:fixed;top:0;left:0;right:0;height:var(--top-h);z-index:1000;
  background:rgba(7,7,11,.8);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 32px;overflow:hidden;transform: translateZ(0);}
.top-panel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  background-size:50% 100%;animation:slide 3s linear infinite}
@keyframes slide{0%{background-position:-100% 0}100%{background-position:200% 0}}

.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.15rem;
  color:var(--text);text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.brand-mark{width:38px;height:38px;border-radius:10px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold),#8a6d2c);display:grid;place-items:center}
.brand-mark::before{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);
  background-size:200% 100%;animation:shimmer 2.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.brand-mark svg{width:20px;height:20px;color:#07070b;position:relative;z-index:1}
.brand-name{background:linear-gradient(90deg,var(--text) 0%,var(--gold) 50%,var(--text) 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:brandFlow 4s linear infinite}
@keyframes brandFlow{0%{background-position:200% 0}100%{background-position:-200% 0}}

.header-actions{display:flex;align-items:center;gap:12px}
.top-nav{display:flex;gap:6px;list-style:none}
.top-nav button{display:inline-flex;align-items:center;gap:8px;color:var(--muted);
  font-family:inherit;font-size:.85rem;font-weight:600;padding:8px 14px;
  border-radius:8px;background:none;border:0;cursor:pointer;transition:color .2s,background .2s}
.top-nav button:hover{color:var(--text);background:var(--surface)}
.top-nav svg{width:16px;height:16px}

.lang-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
  border-radius:8px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:.8rem;font-weight:800;
  cursor:pointer;transition:border-color .2s,background .2s}
.lang-toggle:hover{border-color:var(--gold);background:var(--surface-2)}
.lang-toggle svg{width:16px;height:16px;transition:transform .6s}
.lang-toggle:hover svg{transform:rotate(180deg)}

/* ===== PANEL (PAGES) ===== */
.panel{position:fixed;inset:0;z-index:1;
  padding:calc(var(--top-h) + 20px) 32px calc(var(--bottom-h) + 24px);
  display:none;align-items:center;justify-content:center;overflow:hidden}
.panel.active{display:flex;animation:panelIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.panel-inner{width:100%;max-width:1100px;max-height:100%;
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:4px;
  -webkit-overflow-scrolling:touch;will-change:transform;}
.panel-inner::-webkit-scrollbar{width:6px}
.panel-inner::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.panel-content{margin:auto;width:100%;display:flex;flex-direction:column}

/* ===== HERO ===== */
.hero .panel-content{align-items:center;text-align:center}
.hero-neon-box{position:relative;width:130px;height:130px;border-radius:30px;overflow:hidden;
  margin-bottom:24px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:3px;box-shadow:0 0 35px rgba(201,168,76,0.2);z-index:1;}
.hero-neon-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg, transparent 20%, var(--gold) 50%, transparent 80%);
  animation:rotateBorder 3s linear infinite;z-index:1;}
.hero-neon-img{position:relative;z-index:3;width:100%;height:100%;object-fit:cover;
  border-radius:27px;transition:transform 0.3s ease;}
.hero-neon-box:hover .hero-neon-img{transform:scale(1.08);}

.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;
  background:var(--surface);border:1px solid var(--border);border-radius:100px;
  font-size:.85rem;color:var(--muted);margin-bottom:24px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--gold-glow)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(1.8rem,6vw,3.8rem);font-weight:900;line-height:1.15;
  letter-spacing:-1.5px;margin-bottom:20px;background:linear-gradient(180deg,#fff 0%,#8a8aa0 120%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.about-box{background:linear-gradient(135deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);border-radius:20px;padding:24px 28px;
  margin:8px 0 26px;width:100%;max-width:640px;position:relative;overflow:hidden}
.about-box::before{content:'';position:absolute;top:0;inset-inline-start:20%;inset-inline-end:20%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.about-box h3{color:var(--gold);font-size:1.05rem;margin-bottom:10px;font-weight:800;display:flex;align-items:center;gap:8px}
.about-box h3 svg{width:18px;height:18px}
.about-box p{color:var(--muted);font-size:.92rem;line-height:1.9;text-align:start}

.cta-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;
  border-radius:12px;font-family:inherit;font-size:.92rem;font-weight:700;
  border:1px solid transparent;cursor:pointer;outline:none;transition:transform .2s,opacity .2s,background .2s}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--gold);color:#07070b}
.btn-primary:hover{transform:translateY(-2px);opacity:.92}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);text-decoration:none}
.btn-ghost:hover{background:var(--surface);transform:translateY(-2px)}
.btn-ghost:active{transform:translateY(0)}
html[dir="rtl"] .btn-primary svg.arrow{transform:scaleX(-1)}

/* ==================================================== */
/* ===== SLIDER (ULTRA FAST 1000FPS VERSION) ========== */
/* ==================================================== */
.ad-slider {
  width: 100%;
  max-width: 680px;
  margin: 10px auto 26px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5), 0 0 20px rgba(201,168,76,0.08);
  aspect-ratio: 16 / 9;
  background: var(--surface);
  direction: ltr; /* اسلایدر همیشه از چپ به راست رفتار میکند */
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y; /* جلوگیری از تداخل با اسکرول عمودی */
  transform: translateZ(0); /* فعالسازی GPU */
}

.slider-track {
  display: flex;
  height: 100%;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.slide {
  min-width: 100%;
  height: 100%;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
}

.slide::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(7,7,11,0.75) 100%);
  pointer-events: none;
}

.slider-dots {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  z-index: 3;
  padding: 6px 12px;
  background: rgba(7,7,11,0.55);
  border-radius: 100px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08);
}

.slider-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  background: rgba(255,255,255,0.35);
  cursor: pointer;
  transition: background 0.3s ease, width 0.3s ease, border-radius 0.3s ease, transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.slider-dot:hover {
  background: rgba(255,255,255,0.6);
  transform: scale(1.15);
}

.slider-dot.active {
  background: var(--gold);
  width: 22px;
  border-radius: 100px;
  box-shadow: 0 0 10px var(--gold);
  transform: scale(1);
}

/* ===== TIMELINE ===== */
.beats-list{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.beat{display:grid;grid-template-columns:110px 1fr;gap:24px;padding:22px 16px;
  border-bottom:1px solid var(--border);border-radius:10px;transition:background .2s,transform .2s}
.beat:hover{background:var(--surface);transform:translateX(-4px)}
.beat-date{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.beat-tag{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.5px;color:var(--gold);margin-bottom:4px}
.beat-tag svg{width:12px;height:12px}
.beat-title{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.beat-desc{font-size:.88rem;color:var(--muted)}

/* ===== ARCHIVE (PROJECTS) ===== */
.archive-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:16px;width: 100%;}
.archive-card{background:linear-gradient(145deg, var(--surface), var(--surface-2));border:1px solid var(--border);
  border-radius:16px;padding:20px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px;
  position:relative;overflow:hidden;will-change: transform;transform: translateZ(0); 
  transition: transform .25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color .25s;}
.archive-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .25s;}
.archive-card:hover{transform: translateY(-4px) scale(1.01);border-color:var(--gold);box-shadow: 0 8px 20px rgba(0,0,0,0.4);}
.archive-card:hover::before{opacity:1}
.card-icon{width:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--gold);transition: color .2s, background .2s, transform .2s;}
.archive-card:hover .card-icon{background: var(--gold-glow); transform: scale(1.05);}
.card-icon svg{width:22px;height:22px}
.archive-card h3{font-size:1.05rem;font-weight:800;color:var(--text)}
.archive-card p{font-size:.85rem;color:var(--muted);flex:1; line-height:1.6}

/* ===== TUTORIALS ===== */
.tutorial-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:16px;width: 100%;}
.tut-card{background:linear-gradient(145deg, var(--surface), var(--surface-2));border:1px solid var(--border);
  border-radius:16px;padding:24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px;
  position:relative;overflow:hidden;cursor:pointer;transition: transform .2s, border-color .2s;}
.tut-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.tut-card h3{font-size:1.2rem;font-weight:800;color:var(--text);display:flex;align-items:center;gap:10px}
.tut-card p{font-size:.9rem;color:var(--muted)}

.tut-content-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;}
.tut-content-box h2{color:var(--gold);font-size:1.5rem;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px;}
.tut-content-box h3{color:var(--text);font-size:1.1rem;margin-top:20px;margin-bottom:10px;}
.tut-content-box p{color:var(--muted);font-size:.95rem;line-height:1.9;margin-bottom:12px;}
.tut-content-box pre{background:#000;padding:16px;border-radius:8px;border:1px solid var(--border);overflow-x:auto;direction:ltr;margin-bottom:16px;}
.tut-content-box code{font-family:monospace;color:#4ade80;font-size:.9rem;line-height:1.5;}
.tut-content-box ul{margin-right:20px;margin-bottom:16px;color:var(--muted);font-size:.95rem;}
.tut-content-box li{margin-bottom:8px;}

/* ===== OVERLAYS ===== */
.overlay{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(7,7,11,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:20px;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.join-modal{background:var(--surface-2);border:1px solid var(--gold);border-radius:20px;padding:32px;
  text-align:center;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.8);}
.join-modal h2{font-size:1.2rem;margin-bottom:24px;color:var(--text);}
.join-modal .btn{width:100%;margin-bottom:12px;justify-content:center;}

.loading-screen{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.loading-logo{font-size:2.5rem;font-weight:900;color:var(--gold);margin-bottom:20px;
  text-shadow:0 0 20px var(--gold-glow);animation:pulseNeon 1.5s infinite;}
.loading-bar{width:200px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.loading-bar-inner{height:100%;background:var(--gold);animation:loadBar 1.5s linear forwards;}

/* ===== PRICING ===== */
.pricing-header{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;padding:16px;border-radius:14px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.08),transparent)}
.pricing-header svg{width:28px;height:28px;color:var(--gold);filter:drop-shadow(0 0 10px var(--gold-glow));animation:pulseIcon 2s ease-in-out infinite}
@keyframes pulseIcon{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pricing-header h2{font-size:1.5rem;font-weight:800;
  background:linear-gradient(90deg,var(--text),var(--gold),var(--text));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:brandFlow 4s linear infinite}
.price-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:13px 20px;border-bottom:1px solid var(--border);transition:background .2s}
.price-row:last-child{border-bottom:0}
.price-row:hover{background:var(--surface-2)}
.price-name{color:var(--text);font-size:.9rem;flex:1;min-width:0}
.price-val{color:var(--gold);font-weight:700;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
.price-row:hover .price-val{color:#e8c568}

/* ===== CONTACT ===== */
.contact-box{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--border);border-radius:24px;padding:48px 32px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;overflow:hidden;width:100%}
.contact-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,var(--gold-glow),transparent 30%);animation:rotate 6s linear infinite;opacity:.3}
@keyframes rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.contact-box>*{position:relative;z-index:1}
.contact-box h3{font-size:1.8rem;font-weight:800}
.contact-box p{color:var(--muted);max-width:440px;font-size:.92rem}
.contact-info{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.contact-link{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;background:var(--bg);border:1px solid var(--gold);
  color:var(--gold);font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .2s,background .2s}
.contact-link svg{width:18px;height:18px}
.contact-link:hover{transform:scale(1.03);background:rgba(201,168,76,.1)}
html[dir="rtl"] .contact-link:first-child{direction:ltr}

/* ==================================================== */
/* ===== BOTTOM PANEL (NEON GLASS PILL) =============== */
/* ==================================================== */
.bottom-panel{position:fixed;bottom:20px;left:50%;transform: translate3d(-50%, 0, 0);z-index:1000;
  padding: 2px; border-radius: 100px; overflow: hidden; 
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(201,168,76,0.2);
  will-change: transform;-webkit-backface-visibility: hidden;backface-visibility: hidden;}
.bottom-panel::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg, transparent 10%, var(--gold) 50%, transparent 90%);
  animation:rotateBorder 4s linear infinite;z-index:0;}
.bottom-panel-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-around;
  padding:8px 10px;gap:2px;min-width:340px;max-width:95vw;
  background: rgba(20, 20, 30, 0.6); backdrop-filter: blur(30px) saturate(200%);-webkit-backdrop-filter: blur(30px) saturate(200%);
  border-radius: 100px;border: 1px solid rgba(255, 255, 255, 0.08); }
.dock-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:56px;padding:8px 0;border-radius:14px; color:var(--muted);background:transparent;border:0;
  font-family:inherit;cursor:pointer;position:relative;transition:color .2s,background .2s, transform .2s; -webkit-tap-highlight-color:transparent;}
.dock-item svg{width:20px;height:20px;transition:transform .2s}
.dock-item span{font-size:.55rem;font-weight:600}
.dock-item:hover{color:var(--text);background:rgba(255,255,255,.08)}
.dock-item:hover svg{transform:translateY(-1px)}
.dock-item.active{color:var(--gold);background: rgba(201,168,76,0.15);box-shadow: inset 0 0 10px rgba(201,168,76,0.1);border-radius: 14px;}
.dock-item.active::after { display: none; }

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
  :root{--top-h:60px;--bottom-h:90px}
  .top-panel{padding:0 14px}
  .top-nav{display:none}
  .panel{padding:calc(var(--top-h) + 12px) 14px calc(var(--bottom-h) + 16px)}
  .archive-grid, .tutorial-grid{grid-template-columns:1fr;gap:12px}
  .beat{grid-template-columns:1fr;gap:6px;padding:16px 12px}
  .contact-box{padding:32px 20px}
  
  .bottom-panel-inner { padding:6px 5px; width:95vw; justify-content:space-between; }
  .dock-item{width:16%;padding:6px 0;border-radius: 12px;}
  .dock-item.active{border-radius: 12px;}
  .dock-item span{font-size:.5rem}
  
  .about-box{padding:20px 20px}
  .pricing-header h2{font-size:1.25rem}
  .price-row{padding:12px 16px}
  .price-name,.price-val{font-size:.82rem}
  .brand-name{font-size:1rem}
  .lang-toggle{padding:6px 10px;font-size:.72rem}
  .ad-slider { max-width: 100%; }
}

@supports not (backdrop-filter: blur(1px)) {
  .bottom-panel-inner { background: rgba(20, 20, 30, 0.95); }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- TOP PANEL -->
<header class="top-panel">
  <button class="brand" data-target="home">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M6 12l10-8M6 12l10 8"/></svg>
    </span>
    <span class="brand-name">King Studio</span>
  </button>
  <div class="header-actions">
    <nav>
      <ul class="top-nav">
        <li><button data-target="timeline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>

let currentLang = 'fa';
function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-fa]').forEach(el => {
    const txt = el.dataset[lang];
    if (txt !== undefined) el.textContent = txt;
  });
  document.getElementById('langLabel').textContent = (lang === 'fa') ? 'EN' : 'فا';
  try { localStorage.setItem('kingLang', lang); } catch(e){}
}

});

// ===== Navigation =====
const panels = document.querySelectorAll('.panel');
const dockItems = document.querySelectorAll('.dock-item');
function navigate(id){
  const target = document.getElementById(id);
  if (!target) return;
  panels.forEach(p => p.classList.toggle('active', p.id === id));
  dockItems.forEach(d => d.classList.toggle('active', d.dataset.target === id));
  const inner = target.querySelector('.panel-inner');
  if (inner) inner.scrollTop = 0;
  history.replaceState(null, '', '#' + id);
}
document.querySelectorAll('[data-target]').forEach(el => {
  el.addEventListener('click', e => {
    e.preventDefault();
    navigate(el.dataset.target);
  });
});

// ===== SLIDER SYSTEM (1000FPS ULTRA SMOOTH) ==========
// =====================================================
class AdSlider {
  constructor(container) {
    this.container = container;
    this.track = container.querySelector('.slider-track');
    this.dotsContainer = container.querySelector('.slider-dots');
    this.realCount = this.track.children.length - 1; // Last child is clone
    this.index = 0;
    this.locked = false;
    this.autoplayMs = parseInt(container.dataset.autoplay) || 3500;
    
    this.initDots();
    this.bindEvents();
    this.track.style.transition = 'transform 0.65s cubic-bezier(0.4, 0, 0.2, 1)';
    this.timer = setInterval(() => this.next(), this.autoplayMs);
  }
  
  initDots() {
    for (let i = 0; i < this.realCount; i++) {
      const dot = document.createElement('button');
      dot.className = 'slider-dot' + (i === 0 ? ' active' : '');
      dot.dataset.index = i;
      dot.setAttribute('aria-label', `Slide ${i + 1}`);
      this.dotsContainer.appendChild(dot);
    }
    this.dots = this.dotsContainer.children;
  }
  
  updateDots() {
    const realIdx = this.index >= this.realCount ? 0 : this.index;
    for (let i = 0; i < this.dots.length; i++) {
      this.dots[i].classList.toggle('active', i === realIdx);
    }
  }
  
  goTo(idx, animate = true) {
    this.track.style.transition = animate 
      ? 'transform 0.65s cubic-bezier(0.4, 0, 0.2, 1)' 
      : 'none';
    this.track.style.transform = `translate3d(-${idx * 100}%, 0, 0)`;
    this.index = idx;
  }
  
  handleTransitionEnd = (e) => {
    if (e.propertyName !== 'transform') return;
    
    if (this.index >= this.realCount) {
      // Seamlessly jump back to start (clone → real first slide)
      this.goTo(0, false);
      void this.track.offsetHeight; /* Force reflow */
      requestAnimationFrame(() => {
        this.track.style.transition = 'transform 0.65s cubic-bezier(0.4, 0, 0.2, 1)';
      });
    }
    this.updateDots();
    this.locked = false;
  }
  
  next() {
    if (this.locked) return;
    if (!this.container.offsetParent) return; // Skip if hidden page
    this.locked = true;
    this.goTo(this.index + 1);
  }
  
  prev() {
    if (this.locked) return;
    if (!this.container.offsetParent) return;
    this.locked = true;
    if (this.index === 0) {
      // Jump to clone position instantly, then animate backwards
      this.goTo(this.realCount, false);
      void this.track.offsetHeight;
      requestAnimationFrame(() => {
        this.goTo(this.realCount - 1, true);
      });
    } else {
      this.goTo(this.index - 1);
    }
  }
  
  bindEvents() {
    this.track.addEventListener('transitionend', this.handleTransitionEnd);
    
    // Dots click
    this.dotsContainer.addEventListener('click', (e) => {
      const dot = e.target.closest('.slider-dot');
      if (!dot || this.locked) return;
      const target = parseInt(dot.dataset.index);
      if (target === this.index) return;
      this.locked = true;
      this.goTo(target);
    });
    
    // Pause on hover (desktop)
    this.container.addEventListener('mouseenter', () => {
      clearInterval(this.timer);
    });
    this.container.addEventListener('mouseleave', () => {
      this.timer = setInterval(() => this.next(), this.autoplayMs);
    });
    
    // Touch swipe (mobile)
    let startX = 0, startY = 0, swiping = false;
    this.container.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      swiping = false;
    }, {passive: true});
    
    this.container.addEventListener('touchmove', (e) => {
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
        swiping = true;
      }
    }, {passive: true});
    
    this.container.addEventListener('touchend', (e) => {
      if (!swiping) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (dx < -40) this.next();
      else if (dx > 40) this.prev();
      swiping = false;
    }, {passive: true});
  }
}
